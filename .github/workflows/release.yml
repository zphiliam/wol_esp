name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: esp32c3
            fqbn: "esp32:esp32:esp32c3:CDCOnBoot=cdc,CPUFreq=160,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs"
            core: "esp32:esp32"
            core_url: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
            artifact: "wol_esp32c3.bin"
          - name: esp12f
            fqbn: "esp8266:esp8266:nodemcuv2"
            core: "esp8266:esp8266"
            core_url: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
            artifact: "wol_esp12f.bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino data
        id: cache-arduino
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ matrix.core }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            arduino-${{ matrix.core }}-

      - name: Add board index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "${{ matrix.core_url }}"

      - name: Install core
        if: steps.cache-arduino.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"

      - name: Install libraries
        if: steps.cache-arduino.outputs.cache-hit != 'true'
        run: |
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ArduinoJson"

      - name: Build firmware
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --output-dir build/ \
            .

      - name: Rename artifact
        run: |
          # arduino-cli 输出文件名因版本而异，找到 .bin 并重命名
          BIN=$(find build/ -name "*.bin" ! -name "*bootloader*" ! -name "*partitions*" ! -name "*merged*" | head -1)
          cp "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4  # TODO: 确认是否有支持 Node 24 的新版本
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            wol_esp32c3.bin
            wol_esp12f.bin

  release-gitee:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4  # TODO: 确认是否有支持 Node 24 的新版本
        with:
          merge-multiple: true

      - name: Create Gitee Release and upload assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          # 创建 release
          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"Release ${TAG}\",
              \"body\": \"Release ${TAG}\",
              \"target_commitish\": \"main\"
            }")
          echo "Create release response: ${RESPONSE}"
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee release"
            exit 1
          fi
          echo "Gitee release id: $RELEASE_ID"

          # 上传固件文件
          for FILE in wol_esp32c3.bin wol_esp12f.bin; do
            echo "Uploading $FILE ..."
            UPLOAD_RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}")
            echo "Upload response: ${UPLOAD_RESP}"
          done
