name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: esp32c3
            fqbn: "esp32:esp32:esp32c3:CDCOnBoot=cdc,CPUFreq=160,FlashMode=qio,FlashSize=4M,PartitionScheme=min_spiffs"
            core: "esp32:esp32"
            core_url: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
            artifact: "wol_esp32c3.bin"
          - name: esp12f
            fqbn: "esp8266:esp8266:nodemcuv2"
            core: "esp8266:esp8266"
            core_url: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
            artifact: "wol_esp12f.bin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Add board index
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "${{ matrix.core_url }}"

      - name: Install core
        run: |
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"

      - name: Install libraries
        run: |
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ArduinoJson"

      - name: Build firmware
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --output-dir build/ \
            .

      - name: Rename artifact
        run: |
          # arduino-cli 输出文件名因版本而异，找到 .bin 并重命名
          BIN=$(find build/ -name "*.bin" ! -name "*bootloader*" ! -name "*partitions*" ! -name "*merged*" | head -1)
          cp "$BIN" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            wol_esp32c3.bin
            wol_esp12f.bin

  release-gitee:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Sync Gitee mirror from GitHub
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_REPO}" ]; then
            echo "GITEE_TOKEN or GITEE_REPO secret not configured, skipping Gitee sync."
            exit 0
          fi
          # 触发 Gitee 从 GitHub 同步（镜像仓库不可直接 push）
          curl -sf -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/sync" \
            -d "access_token=${GITEE_TOKEN}"
          # 等待同步完成（通常 10~30s，轮询 tag 是否出现）
          for i in $(seq 1 12); do
            sleep 10
            STATUS=$(curl -sf "https://gitee.com/api/v5/repos/${GITEE_REPO}/tags?access_token=${GITEE_TOKEN}" \
              | jq -r '.[].name' | grep -x "${{ github.ref_name }}" || true)
            if [ -n "$STATUS" ]; then
              echo "Tag ${{ github.ref_name }} synced."
              break
            fi
            echo "Waiting for sync... ($i/12)"
          done

      - name: Create Gitee Release and upload assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GITEE_TOKEN}" ] || [ -z "${GITEE_REPO}" ]; then
            echo "GITEE_TOKEN or GITEE_REPO secret not configured, skipping Gitee release."
            exit 0
          fi
          # 创建 release
          RESPONSE=$(curl -sf -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${GITEE_TOKEN}\",
              \"tag_name\": \"${TAG}\",
              \"name\": \"Release ${TAG}\",
              \"body\": \"Release ${TAG}\"
            }")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Gitee release id: $RELEASE_ID"

          # 上传固件文件
          for FILE in wol_esp32c3.bin wol_esp12f.bin; do
            echo "Uploading $FILE ..."
            curl -sf -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${FILE}"
          done
