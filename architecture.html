<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>WoL ESP-12F — 系统架构</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1018;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    padding: 32px 16px;
  }
  svg {
    width: 100%;
    max-width: 980px;
    height: auto;
    filter: drop-shadow(0 8px 40px rgba(0,0,0,0.6));
  }
</style>
</head>
<body>
<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Arrow markers -->
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 z" fill="#4facfe"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 z" fill="#3ddc84"/>
  </marker>
  <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 z" fill="#ffb020"/>
  </marker>

  <!-- Glows -->
  <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Box gradients -->
  <linearGradient id="g-app" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1a2e50"/>
    <stop offset="100%" stop-color="#111e36"/>
  </linearGradient>
  <linearGradient id="g-broker" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e1a40"/>
    <stop offset="100%" stop-color="#14122c"/>
  </linearGradient>
  <linearGradient id="g-esp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#122e24"/>
    <stop offset="100%" stop-color="#0c1e18"/>
  </linearGradient>
  <linearGradient id="g-pc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a1e0e"/>
    <stop offset="100%" stop-color="#1a1208"/>
  </linearGradient>
</defs>

<!-- ─── Background ─────────────────────────────── -->
<rect width="980" height="620" rx="20" fill="#0d1520"/>

<!-- ─── Title ──────────────────────────────────── -->
<text x="490" y="46" text-anchor="middle" fill="#dce3f0" font-size="22" font-weight="700" letter-spacing="3">WoL ESP-12F — 系统架构</text>
<line x1="180" y1="60" x2="800" y2="60" stroke="#1e2c44" stroke-width="1"/>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Box: Android App ───────────────────────── -->
<!-- ══════════════════════════════════════════════ -->
<rect x="28" y="148" width="188" height="232" rx="16"
      fill="url(#g-app)" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.5"/>

<!-- accent top bar -->
<rect x="28" y="148" width="188" height="4" rx="2" fill="#4facfe" opacity="0.7"/>

<text x="122" y="196" text-anchor="middle" font-size="38">📱</text>
<text x="122" y="226" text-anchor="middle" fill="#dce3f0" font-size="17" font-weight="700">Android App</text>
<text x="122" y="246" text-anchor="middle" fill="#6e7a99" font-size="12">UniApp · Vue 3</text>

<line x1="50" y1="260" x2="194" y2="260" stroke="#1e2c44" stroke-width="1"/>

<text x="122" y="280" text-anchor="middle" fill="#4facfe" font-size="12" font-family="monospace">Paho MQTT</text>
<text x="122" y="300" text-anchor="middle" fill="#6e7a99" font-size="11">WebSocket over TLS</text>

<!-- protocol badge -->
<rect x="58" y="316" width="128" height="26" rx="8"
      fill="rgba(79,172,254,0.1)" stroke="rgba(79,172,254,0.35)" stroke-width="1"/>
<text x="122" y="334" text-anchor="middle" fill="#4facfe" font-size="13" font-weight="700"
      font-family="monospace">WSS  :8084</text>

<text x="122" y="362" text-anchor="middle" fill="#3a4a66" font-size="11">EMQX Cloud 接入点</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Box: EMQX Broker ───────────────────────── -->
<!-- ══════════════════════════════════════════════ -->
<rect x="398" y="118" width="184" height="292" rx="16"
      fill="url(#g-broker)" stroke="#b794f4" stroke-width="1.5" stroke-opacity="0.5"/>
<rect x="398" y="118" width="184" height="4" rx="2" fill="#b794f4" opacity="0.7"/>

<text x="490" y="168" text-anchor="middle" font-size="38">☁️</text>
<text x="490" y="198" text-anchor="middle" fill="#dce3f0" font-size="17" font-weight="700">EMQX Cloud</text>
<text x="490" y="218" text-anchor="middle" fill="#6e7a99" font-size="12">MQTT Broker</text>

<line x1="420" y1="232" x2="560" y2="232" stroke="#1e2c44" stroke-width="1"/>

<!-- Retain section -->
<text x="490" y="254" text-anchor="middle" fill="#b794f4" font-size="11" font-weight="700" letter-spacing="2">RETAIN 缓存</text>

<rect x="420" y="264" width="140" height="28" rx="7"
      fill="rgba(61,220,132,0.1)" stroke="rgba(61,220,132,0.3)" stroke-width="1"/>
<circle cx="438" cy="278" r="5" fill="#3ddc84"/>
<text x="453" y="282" fill="#3ddc84" font-size="12" font-weight="600">online</text>

<rect x="420" y="298" width="140" height="28" rx="7"
      fill="rgba(79,172,254,0.1)" stroke="rgba(79,172,254,0.3)" stroke-width="1"/>
<circle cx="438" cy="312" r="5" fill="#4facfe"/>
<text x="453" y="316" fill="#4facfe" font-size="12" font-weight="600">reconnect</text>

<rect x="420" y="332" width="140" height="28" rx="7"
      fill="rgba(255,69,102,0.1)" stroke="rgba(255,69,102,0.3)" stroke-width="1"/>
<circle cx="438" cy="346" r="5" fill="#ff4566"/>
<text x="453" y="350" fill="#ff4566" font-size="12" font-weight="600">offline  (LWT)</text>

<line x1="420" y1="370" x2="560" y2="370" stroke="#1e2c44" stroke-width="1"/>
<text x="490" y="388" text-anchor="middle" fill="#3a4260" font-size="10">新客户端订阅后</text>
<text x="490" y="402" text-anchor="middle" fill="#3a4260" font-size="10">立即推送当前状态</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Box: ESP8266 ───────────────────────────── -->
<!-- ══════════════════════════════════════════════ -->
<rect x="764" y="148" width="188" height="232" rx="16"
      fill="url(#g-esp)" stroke="#3ddc84" stroke-width="1.5" stroke-opacity="0.5"/>
<rect x="764" y="148" width="188" height="4" rx="2" fill="#3ddc84" opacity="0.7"/>

<text x="858" y="196" text-anchor="middle" font-size="38">🔌</text>
<text x="858" y="226" text-anchor="middle" fill="#dce3f0" font-size="17" font-weight="700">ESP8266</text>
<text x="858" y="246" text-anchor="middle" fill="#6e7a99" font-size="12">ESP-12F · GPIO2 LED</text>

<line x1="786" y1="260" x2="930" y2="260" stroke="#1e2c44" stroke-width="1"/>

<text x="858" y="280" text-anchor="middle" fill="#3ddc84" font-size="12" font-family="monospace">PubSubClient</text>
<text x="858" y="300" text-anchor="middle" fill="#6e7a99" font-size="11">MQTT over TLS</text>

<!-- protocol badge -->
<rect x="794" y="316" width="128" height="26" rx="8"
      fill="rgba(61,220,132,0.1)" stroke="rgba(61,220,132,0.35)" stroke-width="1"/>
<text x="858" y="334" text-anchor="middle" fill="#3ddc84" font-size="13" font-weight="700"
      font-family="monospace">MQTTS  :8883</text>

<text x="858" y="362" text-anchor="middle" fill="#3a4a66" font-size="11">TLS 加密 · 不验证证书</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Box: Target PC ─────────────────────────── -->
<!-- ══════════════════════════════════════════════ -->
<rect x="764" y="462" width="188" height="104" rx="16"
      fill="url(#g-pc)" stroke="#ffb020" stroke-width="1.5" stroke-opacity="0.5"/>
<rect x="764" y="462" width="188" height="4" rx="2" fill="#ffb020" opacity="0.6"/>

<text x="858" y="502" text-anchor="middle" font-size="30">🖥️</text>
<text x="858" y="530" text-anchor="middle" fill="#dce3f0" font-size="16" font-weight="700">目标电脑</text>
<text x="858" y="550" text-anchor="middle" fill="#6e7a99" font-size="11">局域网 · WoL 网卡</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Arrows: App ↔ Broker ──────────────────── -->
<!-- ══════════════════════════════════════════════ -->

<!-- /cmd  App→Broker -->
<line x1="218" y1="238" x2="396" y2="238"
      stroke="#4facfe" stroke-width="2" marker-end="url(#arr-blue)" filter="url(#glow-blue)"/>
<rect x="248" y="218" width="118" height="18" rx="5" fill="#0d1520"/>
<text x="307" y="231" text-anchor="middle" fill="#4facfe" font-size="11"
      font-family="monospace" font-weight="700">/cmd</text>

<!-- /event  Broker→App -->
<line x1="396" y1="272" x2="218" y2="272"
      stroke="#3ddc84" stroke-width="2" marker-end="url(#arr-green)" filter="url(#glow-green)"/>
<rect x="248" y="274" width="118" height="18" rx="5" fill="#0d1520"/>
<text x="307" y="287" text-anchor="middle" fill="#3ddc84" font-size="11"
      font-family="monospace" font-weight="700">/event</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Arrows: Broker ↔ ESP ──────────────────── -->
<!-- ══════════════════════════════════════════════ -->

<!-- /cmd  Broker→ESP -->
<line x1="584" y1="238" x2="762" y2="238"
      stroke="#4facfe" stroke-width="2" marker-end="url(#arr-blue)" filter="url(#glow-blue)"/>
<rect x="614" y="218" width="118" height="18" rx="5" fill="#0d1520"/>
<text x="673" y="231" text-anchor="middle" fill="#4facfe" font-size="11"
      font-family="monospace" font-weight="700">/cmd</text>

<!-- /event  ESP→Broker -->
<line x1="762" y1="272" x2="584" y2="272"
      stroke="#3ddc84" stroke-width="2" marker-end="url(#arr-green)" filter="url(#glow-green)"/>
<rect x="614" y="274" width="118" height="18" rx="5" fill="#0d1520"/>
<text x="673" y="287" text-anchor="middle" fill="#3ddc84" font-size="11"
      font-family="monospace" font-weight="700">/event</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Arrow: ESP → Target PC (WoL) ──────────── -->
<!-- ══════════════════════════════════════════════ -->
<line x1="858" y1="382" x2="858" y2="460"
      stroke="#ffb020" stroke-width="2.5" stroke-dasharray="7,4"
      marker-end="url(#arr-amber)"/>

<!-- WoL label bubble -->
<rect x="872" y="402" width="90" height="38" rx="8"
      fill="rgba(255,176,32,0.1)" stroke="rgba(255,176,32,0.4)" stroke-width="1"/>
<text x="917" y="418" text-anchor="middle" fill="#ffb020" font-size="11" font-weight="700">UDP 广播</text>
<text x="917" y="433" text-anchor="middle" fill="#ffb020" font-size="11" font-family="monospace">:9</text>

<!-- magic packet label -->
<text x="856" y="395" text-anchor="end" fill="#7a5a20" font-size="10">Magic Packet</text>
<text x="856" y="408" text-anchor="end" fill="#7a5a20" font-size="10">102 bytes</text>

<!-- ══════════════════════════════════════════════ -->
<!-- ─── Bottom: Topic strip ───────────────────── -->
<!-- ══════════════════════════════════════════════ -->
<rect x="28" y="576" width="924" height="34" rx="10"
      fill="rgba(28,40,64,0.7)" stroke="#1e2c44" stroke-width="1"/>

<!-- blue dot + cmd topic -->
<circle cx="52" cy="593" r="5" fill="#4facfe"/>
<text x="63" y="597" fill="#6e7a99" font-size="11">指令：</text>
<text x="103" y="597" fill="#4facfe" font-size="11" font-family="monospace">home/wol/esp_12f_01/cmd</text>

<!-- separator -->
<line x1="370" y1="580" x2="370" y2="606" stroke="#1e2c44" stroke-width="1"/>

<!-- green dot + event topic -->
<circle cx="390" cy="593" r="5" fill="#3ddc84"/>
<text x="402" y="597" fill="#6e7a99" font-size="11">事件：</text>
<text x="442" y="597" fill="#3ddc84" font-size="11" font-family="monospace">home/wol/esp_12f_01/event</text>

<!-- separator -->
<line x1="710" y1="580" x2="710" y2="606" stroke="#1e2c44" stroke-width="1"/>

<!-- version -->
<text x="726" y="591" fill="#3a4260" font-size="10">FW</text>
<text x="726" y="603" fill="#3a4260" font-size="10" font-family="monospace">1.0.0-20260321</text>

<!-- retain note -->
<text x="820" y="591" fill="#3a4260" font-size="10">online / reconnect /</text>
<text x="820" y="603" fill="#3a4260" font-size="10">offline  均设 retain=true</text>

</svg>
</body>
</html>
